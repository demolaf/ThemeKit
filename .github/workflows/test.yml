name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.job_name }} (${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            toolchain: Xcode 16.4
            target: iOS
            job_name: Test and build iOS
            simulator: 'platform=iOS Simulator,OS=latest,name=iPhone 16'
          - os: macos-26
            toolchain: Xcode 26
            target: iOS
            job_name: Test and build iOS
            simulator: 'platform=iOS Simulator,OS=latest,name=iPhone 17'
          - os: macos-15
            toolchain: Xcode 16.4
            target: macOS
            job_name: Test and build macOS
          - os: macos-26
            toolchain: Xcode 26
            target: macOS
            job_name: Test and build macOS
          - os: macos-15
            toolchain: Xcode 16.4
            target: watchOS
            job_name: Build watchOS
          - os: macos-26
            toolchain: Xcode 26
            target: watchOS
            job_name: Build watchOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 16
        if: matrix.os == 'macos-15'
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Run package tests (iOS)
        if: matrix.target == 'iOS'
        run: |
          xcodebuild test \
            -workspace .swiftpm/xcode/package.xcworkspace \
            -scheme ThemeKit-Package \
            -destination '${{ matrix.simulator }}'

      - name: Run package tests (macOS)
        if: matrix.target == 'macOS'
        run: swift test --arch arm64

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate example project
        working-directory: Example
        run: xcodegen generate

      - name: Build ExampleSwiftUI
        if: matrix.target == 'iOS'
        run: |
          xcodebuild build \
            -project Example/Example.xcodeproj \
            -scheme ExampleSwiftUI \
            -destination '${{ matrix.simulator }}' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build ExampleUIKit
        if: matrix.target == 'iOS'
        run: |
          xcodebuild build \
            -project Example/Example.xcodeproj \
            -scheme ExampleUIKit \
            -destination '${{ matrix.simulator }}' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build ExampleMac
        if: matrix.target == 'macOS'
        run: |
          xcodebuild build \
            -project Example/Example.xcodeproj \
            -scheme ExampleMac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build ExampleWatch
        if: matrix.target == 'watchOS'
        run: |
          xcodebuild build \
            -project Example/Example.xcodeproj \
            -scheme ExampleWatch \
            -destination 'generic/platform=watchOS' \
            CODE_SIGNING_ALLOWED=NO

  doc-samples:
    name: Documentation samples
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Check doc code samples against the public API
        run: swift Scripts/check_doc_samples.swift

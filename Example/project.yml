name: Example
options:
  bundleIdPrefix: com.themekit
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  ThemeKit:
    path: ..

targets:
  ExampleSwiftUI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ExampleSwiftUI
      - Shared
    dependencies:
      - package: ThemeKit
        product: ThemeKit
      - package: ThemeKit
        product: ThemeKitSwiftUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.themekit.example.swiftui
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  ExampleMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - ExampleMac
      - Shared
    dependencies:
      - package: ThemeKit
        product: ThemeKit
      - package: ThemeKit
        product: ThemeKitSwiftUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        PRODUCT_BUNDLE_IDENTIFIER: com.themekit.example.mac
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete

  ExampleWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - ExampleWatch
    dependencies:
      - package: ThemeKit
        product: ThemeKit
      - package: ThemeKit
        product: ThemeKitSwiftUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.themekit.example.watch
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete

  ExampleWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - ExampleWatchUITests
    dependencies:
      - target: ExampleWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.themekit.example.watch.uitests
        SWIFT_VERSION: 6.0
        TEST_TARGET_NAME: ExampleWatch

  ExampleUIKit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ExampleUIKit
      - Shared
    dependencies:
      - package: ThemeKit
        product: ThemeKit
      - package: ThemeKit
        product: ThemeKitUIKit
    info:
      path: ExampleUIKit/App/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.themekit.example.uikit
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

schemes:
  ExampleSwiftUI:
    build:
      targets:
        ExampleSwiftUI: all
  ExampleUIKit:
    build:
      targets:
        ExampleUIKit: all
  ExampleMac:
    build:
      targets:
        ExampleMac: all
  ExampleWatch:
    build:
      targets:
        ExampleWatch: all
        ExampleWatchUITests: [test]
    test:
      targets:
        - ExampleWatchUITests
